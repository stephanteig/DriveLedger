[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/stephanteig/DriveLedger"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Optimise dependencies (SQLite, BLAKE3, hashing) in dev and test builds so
# fixture tests and the compare benchmark run at realistic speed.
# Small, fast release binaries (CLI and app).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2

# Tests include a timing budget (compare 100k x 100k < 2 s), so build them
# with light optimisation.
[profile.test]
opt-level = 1
