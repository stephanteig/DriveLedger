[package]
name = "driveledger"
description = "DriveLedger CLI and MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
driveledger-core = { path = "../core" }
rmcp = { version = "3.8", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "signal", "net"] }

[lints]
workspace = true

[dev-dependencies]
filetime = "0.2.29"
insta = { version = "1.49.0", features = ["json", "redactions", "filters"] }
tempfile = "3.27.0"
